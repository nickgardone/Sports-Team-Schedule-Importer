name: Team Roster Check

on:
  # Run at the start of each major sports season window
  schedule:
    - cron: '0 9 1 2 *'   # Feb 1  — MLS season opens
    - cron: '0 9 1 5 *'   # May 1  — NFL draft done, WNBA opens
    - cron: '0 9 1 8 *'   # Aug 1  — NBA/NHL schedules released
    - cron: '0 9 1 11 *'  # Nov 1  — general off-season check
  # Also allow manual trigger anytime
  workflow_dispatch:

jobs:
  check-teams:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run team check
        id: check
        run: python scripts/check_teams.py
        continue-on-error: true

      - name: Open GitHub issue if changes found
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('team_changes.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Team roster changes detected — ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['data-maintenance']
            });

      - name: Fail the workflow if changes were found
        if: steps.check.outcome == 'failure'
        run: exit 1
